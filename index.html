<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suggesta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #2b2540;
    --glow: #6d5bd0;
    --ink: #f6efe6;
    --ink-soft: rgba(246, 239, 230, 0.72);
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    transition: background-color 1.6s ease;
    overflow: hidden;
  }

  /* Drifting light that takes on each mood's color */
  .glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.55;
    background: var(--glow);
    transition: background-color 1.6s ease;
    pointer-events: none;
  }
  .glow.a { width: 55vmax; height: 55vmax; top: -20vmax; right: -15vmax; animation: driftA 18s ease-in-out infinite alternate; }
  .glow.b { width: 40vmax; height: 40vmax; bottom: -18vmax; left: -10vmax; animation: driftB 22s ease-in-out infinite alternate; opacity: 0.4; }
  @keyframes driftA { to { transform: translate(-8vmax, 10vmax) scale(1.15); } }
  @keyframes driftB { to { transform: translate(10vmax, -8vmax) scale(1.2); } }

  /* Opening moment: big wordmark, letter by letter */
  .intro {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: var(--bg);
    z-index: 10;
    transition: opacity 0.9s ease 0.2s, visibility 0s linear 1.1s, background-color 1.6s ease;
  }
  .intro.done { opacity: 0; visibility: hidden; }
  .wordmark {
    font-family: var(--serif);
    font-size: clamp(3.5rem, 16vw, 11rem);
    letter-spacing: -0.02em;
    display: flex;
  }
  .wordmark span {
    display: inline-block;
    opacity: 0;
    transform: translateY(0.6em) rotate(6deg);
    animation: letterIn 0.9s cubic-bezier(.2,.9,.3,1.2) forwards;
    cursor: default;
  }
  .wordmark span:hover { animation: none; opacity: 1; transform: translateY(-0.12em) rotate(-4deg); transition: transform 0.25s ease; }
  @keyframes letterIn { to { opacity: 1; transform: none; } }

  .splash {
    position: relative;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(1.5rem, 5vw, 4rem);
    transition: opacity 0.6s ease;
  }
  .splash.leaving { opacity: 0; }
  .brand {
    font-family: var(--serif);
    font-size: 1.6rem;
    letter-spacing: -0.01em;
  }
  .statement {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(2.6rem, 9vw, 7rem);
    line-height: 1.05;
    max-width: 14ch;
  }
  .mood {
    display: block;
    font-style: italic;
    min-height: 1.1em;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .mood.swap { opacity: 0; transform: translateY(0.25em); }

  /* Statement and footer arrive once the wordmark clears */
  .reveal { opacity: 0; transform: translateY(1rem); }
  .ready .reveal { animation: rise 0.9s ease forwards; }
  .ready .foot.reveal { animation-delay: 0.3s; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  .foot { display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; }
  .sub { color: var(--ink-soft); max-width: 34ch; line-height: 1.5; }
  .enter {
    font: 500 1rem var(--sans);
    color: var(--bg);
    background: var(--ink);
    border: 0;
    border-radius: 999px;
    padding: 0.95rem 1.8rem;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.3s ease;
  }
  .enter:hover { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(246, 239, 230, 0.16); }
  .enter:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }

  @media (prefers-reduced-motion: reduce) {
    body, .mood, .splash, .enter, .intro, .glow { transition: none; }
    .glow { animation: none; }
    .intro { display: none; }
    .reveal { opacity: 1; transform: none; animation: none !important; }
  }
</style>
</head>
<body>
  <div class="glow a"></div>
  <div class="glow b"></div>

  <div class="intro" id="intro" aria-hidden="true">
    <div class="wordmark" id="wordmark"></div>
  </div>

  <main class="splash" id="splash">
    <div class="brand">Suggesta</div>

    <h1 class="statement reveal">
      Tonight I'm feeling
      <span class="mood" id="mood" aria-live="polite">tired.</span>
    </h1>

    <div class="foot reveal">
      <button class="enter" id="enter" type="button">Find my movie</button>
      <p class="sub">Tell us the mood. We'll pick one film that fits it.</p>
    </div>
  </main>

<script>
  // Where the app goes after the splash. Change this to your login route.
  const NEXT_URL = "login.html";

  // Each mood sets the background and the color of the drifting light.
  const moods = [
    { word: "tired.",        bg: "#2b3a55", glow: "#4f7bd0" },
    { word: "nostalgic.",    bg: "#6b4423", glow: "#e0a04a" },
    { word: "restless.",     bg: "#1f5a5a", glow: "#3fd0b4" },
    { word: "heartbroken.",  bg: "#52263f", glow: "#d0507f" },
    { word: "playful.",      bg: "#7a3b2e", glow: "#f0845a" },
    { word: "curious.",      bg: "#3d4a2a", glow: "#a8d060" }
  ];

  const root = document.documentElement;
  const moodEl = document.getElementById("mood");
  const splash = document.getElementById("splash");
  const intro = document.getElementById("intro");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let i = 0;

  function show(index) {
    const m = moods[index];
    root.style.setProperty("--bg", m.bg);
    root.style.setProperty("--glow", m.glow);
    moodEl.textContent = m.word;
  }

  // Build the wordmark one letter at a time
  const wordmark = document.getElementById("wordmark");
  "Suggesta".split("").forEach((ch, n) => {
    const s = document.createElement("span");
    s.textContent = ch;
    s.style.animationDelay = (0.15 + n * 0.09) + "s";
    wordmark.appendChild(s);
  });

  show(0);

  function startCycle() {
    if (reduceMotion) return;
    setInterval(() => {
      moodEl.classList.add("swap");
      setTimeout(() => {
        i = (i + 1) % moods.length;
        show(i);
        moodEl.classList.remove("swap");
      }, 500);
    }, 2600);
  }

  if (reduceMotion) {
    document.body.classList.add("ready");
  } else {
    // Wordmark plays, then clears and the rest of the screen arrives
    setTimeout(() => intro.classList.add("done"), 1900);
    setTimeout(() => document.body.classList.add("ready"), 2200);
  }
  setTimeout(startCycle, reduceMotion ? 0 : 3200);

  document.getElementById("enter").addEventListener("click", () => {
    splash.classList.add("leaving");
    setTimeout(() => { window.location.href = NEXT_URL; }, reduceMotion ? 0 : 600);
  });
</script>
</body>
</html>
