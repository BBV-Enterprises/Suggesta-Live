<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..900,0..100,0..1;1,9..144,400..900,0..100,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="orb o1" aria-hidden="true"></div>
    <div class="orb o2" aria-hidden="true"></div>
    <div class="orb o3" aria-hidden="true"></div>
    <div class="orb o4" aria-hidden="true"></div>

    <div class="auth-container">
        <h1>Join Suggesta</h1>

        <input id="signup-name" type="text" placeholder="Name" autocomplete="name">
        <input id="signup-email" type="email" placeholder="Email" autocomplete="email">
        <input id="signup-password" type="password" placeholder="Password (8+ characters)" autocomplete="new-password">

        <button id="signup-btn">Create Account</button>

        <p>Already have an account? <a href="login.html">Log in</a></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
